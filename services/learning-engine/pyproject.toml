[project]
name = "learning-engine"
version = "0.0.0"
description = "Adaptive learning engine: BKT, RecommendNext, PlanDay"
requires-python = ">=3.12"
dependencies = [
    "connect-python>=0.9",
    "fastapi>=0.115",
    "protobuf>=6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.84.0",
    "httpx>=0.28",
    "mypy>=1.13",
    "protoc-gen-connect-python>=0.9",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.8",
    "types-protobuf>=7.35.1.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learning_engine", "gen/engine"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
mypy_path = ["src", "gen"]
exclude = ["^gen/"]

[[tool.mypy.overrides]]
module = ["engine.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "gen"]
